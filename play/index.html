<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Londonfax Game Mode</title>
  <link rel="stylesheet" href="play.css">
</head>
<body>
  <header class="top" id="top" hidden>
    <span class="brand">LONDONFAX</span>
    <span id="top-round"></span>
    <span id="top-edits"></span>
    <span id="top-timer" class="timer"></span>
  </header>
  <main id="app" aria-live="polite"></main>
  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grip"></div>
    <h2 id="sheet-title"></h2>
    <p class="sheet-sub" id="sheet-sub"></p>
    <div id="sheet-list" class="sheet-list"></div>
    <button class="btn ghost" id="sheet-cancel" type="button">Cancel</button>
  </section>
  <div class="toast" id="toast" hidden></div>
  <script src="play.js"></script>
</body>
</html>
